<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AutoPark - Registrar Salida</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><img src="../img/logo2.png"><span>AutoPark</span></div>
            <nav class="menu">
                <a href="/dashboard"><i class="fa fa-home"></i> Inicio</a>
                <a href="/entrada"><i class="fa fa-car"></i> Registrar Entrada</a>
                <a href="/salida" class="active"><i class="fa fa-sign-out-alt"></i> Registrar Salida</a>
            </nav>
        </aside>

        <main class="main">
            <header class="header">
                <h2><i class="fa fa-sign-out-alt"></i> Registrar Salida</h2>
            </header>

            <div class="card-box" style="max-width: 600px; margin: 20px auto; padding: 30px;">
                <h3 style="margin-bottom: 20px;">Buscar Vehículo por Placa</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="inputPlaca" placeholder="Ej: MCX5585"
                        style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                    <button class="btn blue" onclick="buscarVehiculo()"
                        style="height: auto; padding: 0 20px;">Buscar</button>
                </div>

                <div id="detalleSalida"
                    style="display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p><strong>Placa:</strong> <span id="txtPlaca"></span></p>
                    <p><strong>Tipo:</strong> <span id="txtTipo"></span></p>
                    <p><strong>Hora Entrada:</strong> <span id="txtEntrada"></span></p>
                    <p><strong>Horas a cobrar:</strong> <span id="txtHoras"></span></p>
                    <p style="font-size: 20px; color: #2ecc71; margin-top: 15px;"><strong>Total a Pagar:</strong> RD$<span
                            id="txtTotal"></span></p>
                    <button class="btn green" onclick="confirmarSalida()"
                        style="width: 100%; margin-top: 20px;">CONFIRMAR SALIDA Y PAGO</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/placa.js"></script>
    <script src="../js/toast.js"></script>
    <script>
        let cotizacion = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem("token")) {
                window.location.href = "/login";
            }
        });

        async function buscarVehiculo() {
            const check = validarPlacaInput(document.getElementById("inputPlaca").value);
            if (!check.ok) {
                toast.warning(check.error);
                return;
            }
            const placa = check.placa;

            try {
                const data = await peticionBackend(`tickets/salida/cotizar?placa=${encodeURIComponent(placa)}`, "GET");
                if (!data.success) {
                    toast.error(data.error || "No se encontró ticket abierto");
                    document.getElementById("detalleSalida").style.display = "none";
                    cotizacion = null;
                    return;
                }

                cotizacion = data.data;
                document.getElementById("txtPlaca").innerText = cotizacion.placa;
                document.getElementById("txtTipo").innerText = cotizacion.tipo;
                document.getElementById("txtEntrada").innerText = new Date(cotizacion.fecha_hora_entrada).toLocaleString();
                document.getElementById("txtHoras").innerText = cotizacion.horas;
                document.getElementById("txtTotal").innerText = Number(cotizacion.monto).toFixed(2);
                document.getElementById("detalleSalida").style.display = "block";
            } catch (error) {
                toast.error("Error conectando con el servidor");
                console.error(error);
            }
        }

        async function confirmarSalida() {
            if (!cotizacion) return;

            try {
                const data = await peticionBackend("tickets/salida", "POST", {
                    ticket_id: cotizacion.ticket_id,
                    placa: cotizacion.placa
                });

                if (data.success) {
                    toast.success(`Salida registrada. Total: RD$${Number(data.total_pagar).toFixed(2)}`);
                    setTimeout(() => window.location.href = "/dashboard", 1500);
                } else {
                    toast.error(data.error || "Error al registrar salida");
                }
            } catch (error) {
                toast.error("Error conectando con el servidor");
                console.error(error);
            }
        }
    </script>
</body>

</html>
