<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoPark - Registrar Entrada</title>
    <link rel="stylesheet" href="../css/vehiculo.css" />
    <link rel="stylesheet" href="../css/entrada.css" />
    <link rel="icon" type="image/png" href="../img/logo2.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <img src="../img/logo2.png" alt="AutoPark" />
                <span>Sistema de parqueo</span>
            </div>
            <nav>
                <a href="/dashboard"><i class="fas fa-home"></i> Inicio</a>
                <a class="active" href="/entrada"><i class="fas fa-car" onclick="admin()"></i> Registrar
                    Entrada</a>
                <a href="/salida"><i class="fas fa-sign-out-alt"></i> Registrar Salida</a>
                <a href="/reportes" class="nav-auth-only"><i class="fas fa-chart-bar"></i> Reportes</a>
            </nav>
        </aside>

        <main class="main">
            <div class="topbar">
                <h2>Registro Vehicular</h2>
                <div class="user">
                    <i class="fas fa-cog"></i>
                    <img src="https://i.pravatar.cc/40" />
                </div>
            </div>

            <div class="container">
                <h2><span id="reloj"></span> - Registro de Movimientos</h2>

                <!-- Formulario rápido de Entrada -->
                <div class="registro-entrada">
                    <div class="form-group">
                        <label>ID Vehículo</label>
                        <input type="number" id="vehiculo_id" placeholder="Ej: 1" required>
                    </div>
                    <button class="btn-entrada" onclick="registrarEntrada()">REGISTRAR ENTRADA</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Vehículo</th>
                            <th>Hora Entrada</th>
                            <th>Hora Salida</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaMovimientos">
                        <!-- Cargado por JS -->
                    </tbody>
                </table>
            </div>

            <script src="../js/api.js"></script>
            <script src="../js/toast.js"></script>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    if (!localStorage.getItem("token")) {
                        window.location.href = "/login";
                        return;
                    }
                    const rol = localStorage.getItem("rol");
                    if (!rol) {
                        document.querySelectorAll(".nav-auth-only").forEach((el) => {
                            el.style.display = "none";
                        });
                    }
                    cargarMovimientos();
                });

                async function cargarMovimientos() {
                    const result = await peticionBackend('tickets', 'GET');
                    const tbody = document.getElementById('listaMovimientos');
                    tbody.innerHTML = '';
                    if (!result.success) return;

                    result.data.forEach(t => {
                        const entrada = new Date(t.fecha_hora_entrada);
                        const salida = t.fecha_hora_salida ? new Date(t.fecha_hora_salida) : null;
                        const esPendiente = !t.fecha_hora_salida;

                        tbody.innerHTML += `
                <tr>
                    <td>#${t.id}</td>
                    <td>${t.vehiculo_id}</td>
                    <td>${entrada.toLocaleTimeString()}</td>
                    <td>${salida ? salida.toLocaleTimeString() : '--:--'}</td>
                    <td>RD$ ${t.total_pagar || 0}</td>
                    <td><span class="status-badge ${esPendiente ? 'pendiente' : 'finalizado'}">
                        ${esPendiente ? 'EN PARQUEO' : 'SALIDA'}</span>
                    </td>
                    <td>
                        ${esPendiente ?
                                `<button class="btn-salida" onclick="registrarSalida(${t.id})">Registrar Salida</button>` :
                                `<span style="color:gray">Completo</span>`}
                    </td>
                </tr>
            `;
                    });
                }

                async function registrarEntrada() {
                    const v_id = document.getElementById('vehiculo_id').value;
                    if (!v_id) return alert("Ingrese ID de vehículo");

                    const vehiculo = await peticionBackend(`vehiculos/${v_id}`, 'GET');
                    if (!vehiculo.success) {
                        toast.error(vehiculo.error || 'Vehículo no encontrado');
                        return;
                    }

                    const data = await peticionBackend('tickets/entrada', 'POST', {
                        placa: vehiculo.data.placa,
                        tipo: vehiculo.data.tipo
                    });

                    if (!data.success) {
                        toast.error(data.error || 'No se pudo registrar la entrada');
                        return;
                    }

                    document.getElementById('vehiculo_id').value = '';
                    toast.success('Entrada registrada');
                    cargarMovimientos();
                }

                async function registrarSalida(ticketId) {
                    const cotizacion = await peticionBackend(`tickets/salida/cotizar?ticket_id=${ticketId}`, 'GET');
                    if (!cotizacion.success) {
                        toast.error(cotizacion.error || 'No se pudo cotizar');
                        return;
                    }

                    const { horas, monto } = cotizacion.data;
                    if (!confirm(`Resumen de Salida:\nHoras: ${horas}\nTotal a pagar: RD$ ${monto}\n\n¿Confirmar salida?`)) {
                        return;
                    }

                    const data = await peticionBackend('tickets/salida', 'POST', { ticket_id: ticketId });
                    if (!data.success) {
                        toast.error(data.error || 'No se pudo registrar la salida');
                        return;
                    }

                    toast.success(`Salida registrada. Total RD$ ${data.total_pagar}`);
                    cargarMovimientos();
                }

                setInterval(() => {
                    document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
                }, 1000);
            </script>

</body>

</html>
